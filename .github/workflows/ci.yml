name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lockfile pins zod 4; the v3 leg overrides it with the minimum
        # supported major so both peer ranges stay covered.
        zod-version: ["4", "3"]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install zod ${{ matrix.zod-version }}
        if: matrix.zod-version == '3'
        run: pnpm add -D zod@^3.25.0
      # Build before test: package-entries.test.ts loads dist/ through
      # require(esm) and cannot run against a missing build.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
